<html lang="de">
<head>
    <meta charset="UTF-8">

        :root {
            --primary-color: #4CAF50;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: #333;
            text-align: center;
            padding: 15px;
            margin: 0;
        }

        h1 {
            color: #2c3e50;
            margin-top: 10px;
            font-size: 32px;
        }

        /* Eingabebereich für neue Kinder */
        .add-section {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: inline-block;
            margin-bottom: 25px;
        }

        input[type="text"] {
            padding: 8px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-right: 10px;
            width: 180px;
        }

        button {
            padding: 8px 12px;
            font-size: 15px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #3498db;
            color: white;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #2980b9;
        }
